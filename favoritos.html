<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favoritos | Noti Zowl</title>
  <!-- Bootstrap 5 (rejilla adaptable, componentes y formularios) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios: paleta y componentes de Noti Zowl -->
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="favoritos">
  <!-- Header y menú (se dibujan desde js/ui.js) -->
  <div id="header"></div>

  <main>
    <section class="seccion"><div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <div><h1 class="h2 m-0">Mis favoritos</h1><small id="contador" class="text-muted" role="status"></small></div>
        <button id="vaciar" class="btn btn-secundario" hidden>Vaciar lista</button>
      </div>
      <div id="lista-fav"></div>
    </div></section>
  </main>

  <!-- Footer (se dibuja desde js/ui.js) -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/favoritos.js"></script>
</body>
</html>
