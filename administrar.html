<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar noticias | Noti Zowl</title>
  <!-- Bootstrap 5 (rejilla adaptable, componentes y formularios) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios: paleta y componentes de Noti Zowl -->
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="administrar">
  <!-- Header y menú (se dibujan desde js/ui.js) -->
  <div id="header"></div>

  <main>
    <section class="seccion"><div class="container">
      <h1 class="h2 mb-4">Gestión de noticias</h1>
      <div class="row g-4">
        <div class="col-lg-5">
          <h2 class="h5">Crear noticia</h2>
          <form id="form-noticia" novalidate>
            <div class="mb-2"><label class="form-label" for="titulo">Título *</label><input class="form-control" id="titulo" name="titulo" placeholder="Título de la noticia"><div class="msg-error" id="err-titulo"></div></div>
            <div class="mb-2"><label class="form-label" for="categoria">Categoría *</label><select class="form-select" id="categoria" name="categoria">
              <option value="">Seleccionar categoría</option><option>Educación</option><option>Tecnología</option><option>Turismo</option><option>Comercial</option></select><div class="msg-error" id="err-categoria"></div></div>
            <div class="mb-2"><label class="form-label" for="imagen">URL de la imagen</label><input class="form-control" id="imagen" name="imagen" placeholder="https://... (opcional)"></div>
            <div class="mb-2"><label class="form-label" for="descripcion">Descripción breve *</label><textarea class="form-control" id="descripcion" name="descripcion" rows="2"></textarea><div class="msg-error" id="err-descripcion"></div></div>
            <div class="mb-3"><label class="form-label" for="contenido">Contenido *</label><textarea class="form-control" id="contenido" name="contenido" rows="4"></textarea><div class="msg-error" id="err-contenido"></div></div>
            <button class="btn btn-primario" type="submit">Guardar noticia</button>
            <div id="exito" class="msg-exito mt-3" role="status" hidden>Noticia creada correctamente.</div>
          </form>
        </div>
        <div class="col-lg-7">
          <h2 class="h5">Noticias existentes</h2>
          <div class="table-responsive"><table class="table align-middle">
            <thead><tr><th>ID</th><th>Título</th><th>Categoría</th><th>Acción</th></tr></thead><tbody id="filas"></tbody></table></div>
          <small class="text-muted" id="total"></small>
        </div>
      </div>
    </div></section>
  </main>

  <!-- Footer (se dibuja desde js/ui.js) -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/administrar.js"></script>
</body>
</html>
