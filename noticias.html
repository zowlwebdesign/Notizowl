<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias | Noti Zowl</title>
  <!-- Bootstrap 5 (rejilla adaptable, componentes y formularios) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios: paleta y componentes de Noti Zowl -->
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="noticias">
  <!-- Header y menú (se dibujan desde js/ui.js) -->
  <div id="header"></div>

  <main>
    <section class="seccion"><div class="container">
      <h1 class="h2">Noticias</h1><p class="text-muted">Explora el catálogo y filtra por categoría.</p>
      <!-- Búsqueda y orden -->
      <div class="row g-2 mb-3">
        <div class="col-md-8"><input id="buscar" type="search" class="form-control" placeholder="Buscar noticias..." aria-label="Buscar noticias"></div>
        <div class="col-md-4"><select id="orden" class="form-select" aria-label="Ordenar">
          <option value="recientes">Ordenar: Más recientes</option><option value="antiguas">Más antiguas</option><option value="az">Título (A-Z)</option></select></div>
      </div>
      <!-- Filtros por categoría -->
      <div id="filtros" class="d-flex flex-wrap gap-2 mb-2">
        <button class="filtro activo" data-cat="Todas">Todas</button><button class="filtro" data-cat="Educación">Educación</button>
        <button class="filtro" data-cat="Tecnología">Tecnología</button><button class="filtro" data-cat="Turismo">Turismo</button><button class="filtro" data-cat="Comercial">Comercial</button>
      </div>
      <p id="resultados" class="small text-muted" role="status"></p>
      <div class="row g-4" id="tarjetas"></div>
      <nav class="mt-4" aria-label="Paginación"><ul class="pagination justify-content-center" id="paginacion"></ul></nav>
    </div></section>
  </main>

  <!-- Footer (se dibuja desde js/ui.js) -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/listado.js"></script>
</body>
</html>
